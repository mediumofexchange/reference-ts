name: CI

# Runs on every push and pull request. The point is that nobody has to
# remember: a session that forgets `npm test`, or that lets the agent handoff
# and decision index drift, finds out here rather than three slices later.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pool:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pinned pool-v1 circuits and real ZK proofs
        run: npm run check:pool

  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor package.json declares; 24 is what the work is done on.
        # If the floor ever stops holding, the engines field is the thing that
        # is wrong, not the test.
        node: [20, 24]
        os: [ubuntu-latest]
        include:
          - node: 24
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Reference, installed package and durable payment acceptance
        run: npm run check
