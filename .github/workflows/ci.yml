name: CI

# Runs on every push and pull request. The point is that nobody has to
# remember: a session that forgets `npm test`, or that lets the agent handoff
# and decision index drift, finds out here rather than three slices later.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pool-v3:
    runs-on: ${{ matrix.os }}
    # The --ergo pass replays every local group a second time from synthetic Ergo block sections through the
    # profile's own framer, and the history acceptance proves some eighty statements; the budget leaves headroom
    # over the baseline (20 minutes on Windows at ae342b1, before the history acceptance).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Six successor proof relations, uninstantiated construction
        run: npm run check:pool:v3 -- --ergo
      - name: Retain source-bound v3 acceptance reports
        uses: actions/upload-artifact@v4
        with:
          name: pool-v3-reports-${{ matrix.os }}
          path: |
            scratch/pool-v3-results.json
            scratch/pool-v3-store-results.json
            scratch/pool-v3-local-replay-results.json
            docs/pool-v3-history-store-verification.json
            docs/pool-v3-recovery-store-verification.json
            docs/pool-v3-recovery-store-ergo-verification.json
            docs/pool-v3-succession-store-verification.json
            docs/pool-v3-succession-store-ergo-verification.json
            docs/pool-v3-scope-store-verification.json
            docs/pool-v3-scope-store-ergo-verification.json
            docs/pool-v3-redemption-store-verification.json
            docs/pool-v3-redemption-store-ergo-verification.json
          if-no-files-found: error
      - name: Diagnose proving parameter integrity on failure
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { existsSync, readdirSync, readFileSync } from 'node:fs';
          const path = 'scratch/private-payment-crs';
          if (existsSync(path)) for (const name of readdirSync(path).filter(n => n.endsWith('.dat'))) {
            const bytes = readFileSync(`${path}/${name}`);
            console.log(JSON.stringify({ name, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') }));
          }
          JS

  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 24 is the floor package.json declares: every party's replay state is
        # node:sqlite (storage decision 2026-09-29). If the floor ever stops
        # holding, the engines field is the thing that is wrong, not the test.
        node: [24]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Reference, installed package and durable payment acceptance
        run: npm run check
