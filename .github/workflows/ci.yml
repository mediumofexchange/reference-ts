name: CI

# Runs on every push and pull request. The point is that nobody has to
# remember: a session that forgets `npm test`, or that lets the agent handoff
# and decision index drift, finds out here rather than three slices later.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether the real-proof jobs run (scripts/real-proof-gate.mjs): they are skipped only when the tree under test
  # differs from a tree whose real-proof jobs all passed solely in re-recorded reports and documentation that no
  # real-proof check reads. Any doubt runs them; a manual dispatch always does.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      groups: ${{ steps.gate.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/real-proof-gate.mjs

  # One job per group of scripts/pool/v3/real-proof.mjs on each system, so the run waits for the slowest group rather
  # than the sum (times in decisions/2026-10.md, 2026-10-06). Each job builds (a few seconds of tsc), checks the proving
  # parameters from a shared cache, runs its group and uploads the reports it wrote.
  pool-v3:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    name: pool-v3 ${{ matrix.group }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Nearly three times the slowest group, the command drill.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        group: ${{ fromJSON(needs.gate.outputs.groups) }}
        # The native backend's group on macOS as well (slice 42): bb.js bundles bb for Linux and macOS. Its report stays
        # in its own artifact (pool-v3-reports-macos-latest-native); the merged ones are Ubuntu's and Windows'.
        include:
          - os: macos-latest
            group: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # prepare-crs.mjs keeps a cached file only when its length and SHA-256 are the ones parameters.ts pins, and
      # fetches it otherwise; the cache only saves the download.
      - name: Proving parameters cache
        uses: actions/cache@v4
        with:
          path: scratch/private-payment-crs
          key: proving-parameters-${{ runner.os }}-${{ hashFiles('src/pool/parameters.ts', 'src/pool/parameter-files.ts') }}
      # The succinct drill's replica proves the venue's exhaustion (slice 43), and the exhaustion group executes the
      # hostile set on the same programs: both compile the shipped circuits once with the pinned native compiler (the
      # hash pins the release asset), which also computes their witnesses, and their crates are cached under the
      # sources, the manifest that pins them and the module that lays them out. Windows has no native backend and
      # proves none.
      - name: Pinned nargo for the exhaustion circuits
        if: (matrix.group == 'succinct' || matrix.group == 'exhaustion') && runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nargo.tar.gz" https://github.com/noir-lang/noir/releases/download/v1.0.0-beta.26/nargo-x86_64-unknown-linux-gnu.tar.gz
          echo "64048040befd55a987158b11137d8f38f9688f696db4d84910dd1bcf0442fb80  $RUNNER_TEMP/nargo.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/nargo" && tar -xzf "$RUNNER_TEMP/nargo.tar.gz" -C "$RUNNER_TEMP/nargo"
          echo "NARGO=$RUNNER_TEMP/nargo/nargo" >> "$GITHUB_ENV"
      - name: Exhaustion programs cache
        if: (matrix.group == 'succinct' || matrix.group == 'exhaustion') && runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: scratch/exhaustion-programs
          key: exhaustion-programs-${{ hashFiles('src/exhaustion-circuits/**', 'src/ergo-exhaustion-set.ts', 'src/ergo-exhaustion-programs.ts', 'src/pool/circuits/vendor/poseidon2.nr') }}
      - name: Pool-v3 real-proof group ${{ matrix.group }}, with the Ergo adapter
        run: npm run check:pool:v3 -- --group ${{ matrix.group }} --ergo --collect scratch/ci-reports
      - name: Retain this group's source-bound v3 acceptance reports
        uses: actions/upload-artifact@v4
        with:
          name: pool-v3-reports-${{ matrix.os }}-${{ matrix.group }}
          path: scratch/ci-reports
          # A group whose scripts write no report (the command drill) uploads nothing; a missing report fails the
          # step before this one.
          if-no-files-found: ignore
      - name: Diagnose proving parameter integrity on failure
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { existsSync, readdirSync, readFileSync } from 'node:fs';
          const path = 'scratch/private-payment-crs';
          if (existsSync(path)) for (const name of readdirSync(path).filter(n => n.endsWith('.dat'))) {
            const bytes = readFileSync(`${path}/${name}`);
            console.log(JSON.stringify({ name, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') }));
          }
          JS

  # Only when every real-proof job passed: merge each system's reports into the one artifact runs re-record from
  # (pool-v3-reports-<os>, laid out at repository paths as before) and record the tested tree for the gate.
  real-proof-passed:
    needs: [gate, pool-v3]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Merge the Ubuntu reports
        uses: actions/upload-artifact/merge@v4
        with:
          name: pool-v3-reports-ubuntu-latest
          pattern: pool-v3-reports-ubuntu-latest-*
      - name: Merge the Windows reports
        uses: actions/upload-artifact/merge@v4
        with:
          name: pool-v3-reports-windows-latest
          pattern: pool-v3-reports-windows-latest-*
      - uses: actions/download-artifact@v4
        with:
          name: pool-v3-reports-ubuntu-latest
          path: scratch/merged/ubuntu-latest
      - uses: actions/download-artifact@v4
        with:
          name: pool-v3-reports-windows-latest
          path: scratch/merged/windows-latest
      - name: Check every report reached its system's artifact
        run: node scripts/pool/v3/real-proof.mjs --expect scratch/merged/ubuntu-latest scratch/merged/windows-latest
      - name: Record the tree whose real-proof jobs passed
        run: node scripts/real-proof-gate.mjs --record scratch/real-proof-tree.z
      - uses: actions/upload-artifact@v4
        with:
          name: real-proof-tree
          path: scratch/real-proof-tree.z
          if-no-files-found: error
          overwrite: true

  check:
    runs-on: ${{ matrix.os }}
    # Windows took about 14 minutes before the browser host's check (slice 39) added about two.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The latest 24.x, at or above the 24.21.0 floor package.json declares:
        # every party's replay state is node:sqlite (storage decision
        # 2026-09-29), and 24.6.0's fails the wallet. If the floor ever stops
        # holding, the engines field is the thing that is wrong, not the test.
        node: [24]
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      # The tests write their kept files under os.tmpdir(). On a hosted Windows runner that is the system drive, where a
      # flush costs 4-9 ms against 0.3 ms on the runner's own drive, so the kept-file tests ran flush-bound (3-4.6x
      # slower, a timeout on a slow host). Defender is not the cause (decisions/2026-10.md, slice 24).
      - name: Temporary files on the runner's own drive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: printf 'TEMP=%s\nTMP=%s\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Reference, installed package and durable payment acceptance
        run: npm run check

      # check:package's release record (scripts/release.mjs): the tarball and install lock this system built.
      - uses: actions/upload-artifact@v4
        with:
          name: release-record-${{ matrix.os }}
          path: scratch/release/release-record.json
          if-no-files-found: error

      # Lists retained reports whose bound sources changed (informational: an older report can stay correct history).
      - name: Retained evidence drift
        run: npm run check:evidence

  # One commit builds one release on both systems: the same tarball bytes and install lock (slice 13 M13a).
  reproducible-release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release-record-ubuntu-latest
          path: scratch/release-ubuntu-latest
      - uses: actions/download-artifact@v4
        with:
          name: release-record-windows-latest
          path: scratch/release-windows-latest
      - run: node scripts/release.mjs --compare scratch/release-ubuntu-latest/release-record.json scratch/release-windows-latest/release-record.json
