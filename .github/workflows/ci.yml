name: CI

# Runs on every push and pull request. The point is that nobody has to
# remember: a session that forgets `npm test`, or that lets the agent handoff
# and decision index drift, finds out here rather than three slices later.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pool-v3:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Six successor proof relations, uninstantiated construction
        run: npm run check:pool:v3
      - name: Diagnose proving parameter integrity on failure
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { existsSync, readdirSync, readFileSync } from 'node:fs';
          const path = 'scratch/private-payment-crs';
          if (existsSync(path)) for (const name of readdirSync(path).filter(n => n.endsWith('.dat'))) {
            const bytes = readFileSync(`${path}/${name}`);
            console.log(JSON.stringify({ name, bytes: bytes.length, sha256: createHash('sha256').update(bytes).digest('hex') }));
          }
          JS

  pool:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pinned pool-v2 circuits and real ZK proofs
        run: npm run check:pool
      - name: Delivery and seed restoration candidate
        run: npm run check:pool:delivery
      - name: Four-output transfers and ordinary fees candidate
        run: npm run check:pool:fees

  check:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor package.json declares; 24 is what the work is done on.
        # If the floor ever stops holding, the engines field is the thing that
        # is wrong, not the test.
        node: [20, 24]
        os: [ubuntu-latest]
        include:
          - node: 24
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Reference, installed package and durable payment acceptance
        run: npm run check

      - name: Offline node identity, accounting and volume handoff guards
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./experiments/ergo-range/node-database-identity.test.ps1
          ./experiments/ergo-range/node-database-evidence.test.ps1
          ./experiments/ergo-range/node-database-native.test.ps1
          ./experiments/ergo-range/native-candidate.test.ps1
          ./experiments/ergo-range/node-volume-evidence.test.ps1
          ./experiments/ergo-range/node-volume-handoff.test.ps1
          ./experiments/ergo-range/node-sync-profile.test.ps1
          ./experiments/ergo-range/node-sync-reader.test.ps1
          ./experiments/ergo-range/node-sync-resume-native.test.ps1
          ./experiments/ergo-range/node-sync-resume.test.ps1

      - name: Install pinned offline Ergo probe dependencies
        if: matrix.node == 24
        run: npm --prefix experiments/ergo-range ci --ignore-scripts --no-audit --no-fund

      - name: Real-block commitment feasibility and serializer counterexamples
        if: matrix.node == 24
        run: npm run check:ergo:range
