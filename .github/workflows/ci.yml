name: CI

# Runs on every push and pull request. The point is that nobody has to
# remember: a session that forgets `npm test`, or that lets the agent handoff
# and decision index drift, finds out here rather than three slices later.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor package.json declares; 24 is what the work is done on.
        # If the floor ever stops holding, the engines field is the thing that
        # is wrong, not the test.
        node: [20, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Docs stay readable
        # Cheap and deterministic, so it only needs to run once.
        if: matrix.node == 24
        run: npm run check:docs

      - name: Package builds and publishes what it claims
        if: matrix.node == 24
        run: |
          npm run build
          npm pack --dry-run
